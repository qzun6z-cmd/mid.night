<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Midnight — رحلتك تبدأ من هنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-elevated: #1a1a25;
  --purple: #7c3aed;
  --purple-light: #a78bfa;
  --purple-dark: #5b21b6;
  --purple-glow: rgba(124, 58, 237, 0.15);
  --text: #e5e5ea;
  --text-muted: #9ca3af;
  --border: rgba(124, 58, 237, 0.2);
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --font-ar: 'Cairo', system-ui, sans-serif;
  --font-en: 'Inter', system-ui, sans-serif;
  --radius: 12px;
  --radius-lg: 20px;
  --transition: 0.25s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ar);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
}

[dir="ltr"] body { font-family: var(--font-en); }

body::before {
  content: '';
  position: fixed;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  height: 80%;
  background: radial-gradient(ellipse, var(--purple-glow) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 16px;
}

.nav-logo {
  font-family: var(--font-en);
  font-weight: 900;
  font-size: 1.4rem;
  color: var(--purple-light);
  text-decoration: none;
  letter-spacing: -0.5px;
  flex-shrink: 0;
  cursor: pointer;
}

.nav-links {
  display: flex;
  gap: 4px;
  flex: 1;
  justify-content: center;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.9rem;
  padding: 8px 14px;
  border-radius: 8px;
  transition: var(--transition);
  white-space: nowrap;
  cursor: pointer;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--purple-light);
  background: var(--purple-glow);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.lang-toggle {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--purple-light);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--font-en);
  font-weight: 700;
  font-size: 0.85rem;
  transition: var(--transition);
}

.lang-toggle:hover {
  background: var(--purple-dark);
  color: #fff;
}

.btn-discord-nav {
  background: #5865F2;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.btn-discord-nav:hover {
  background: #4752c4;
  transform: translateY(-2px);
}

.nav-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
}

.nav-hamburger span {
  width: 22px;
  height: 2px;
  background: var(--purple-light);
  border-radius: 2px;
  transition: var(--transition);
}

.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 64px);
}

.hero-title {
  font-size: clamp(2.2rem, 5vw, 3.5rem);
  font-weight: 900;
  line-height: 1.2;
  background: linear-gradient(135deg, #ffffff 0%, var(--purple-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}

.hero-subtitle {
  font-family: var(--font-en);
  font-size: 0.85rem;
  letter-spacing: 4px;
  color: var(--purple);
  text-transform: uppercase;
  margin-bottom: 20px;
  font-weight: 700;
}

.hero-desc {
  font-size: 1.15rem;
  color: var(--text-muted);
  line-height: 1.9;
  margin-bottom: 40px;
  max-width: 600px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: var(--transition);
  border: none;
  text-align: center;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
}

.btn-primary:hover {
  background: var(--purple-dark);
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(124, 58, 237, 0.45);
}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--purple-light);
  border: 1px solid var(--purple);
}

.btn-secondary:hover {
  background: var(--purple-dark);
  color: #fff;
}

.btn-outline {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
}

.btn-outline:hover {
  border-color: var(--purple);
  color: var(--purple-light);
}

.btn-discord {
  background: #5865F2;
  color: #fff;
}

.btn-discord:hover {
  background: #4752c4;
  transform: translateY(-2px);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.hero-image {
  display: flex;
  align-items: center;
  justify-content: center;
}

.penguin-img {
  width: 100%;
  max-width: 500px;
  height: auto;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 0 40px var(--purple-glow));
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  padding: 20px;
  border: 1px solid var(--border);
}

.page-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px 24px;
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 200px);
}

.page-header {
  margin-bottom: 40px;
}

.page-title {
  font-size: clamp(1.6rem, 3vw, 2rem);
  font-weight: 900;
  color: #fff;
  margin-bottom: 8px;
}

.page-desc {
  color: var(--text-muted);
  font-size: 1.05rem;
}

.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 32px;
  align-items: center;
}

.search-input {
  flex: 1;
  min-width: 240px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
  transition: var(--transition);
}

.search-input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px var(--purple-glow);
}

.search-input::placeholder { color: var(--text-muted); }

.filter-select {
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  cursor: pointer;
}

.filter-select:focus { border-color: var(--purple); }

.paths-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.path-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  transition: var(--transition);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  display: block;
}

.path-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--purple), var(--purple-light));
  opacity: 0;
  transition: var(--transition);
}

.path-card:hover {
  border-color: var(--purple);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(124, 58, 237, 0.15);
}

.path-card:hover::before { opacity: 1; }

.path-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.path-card-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.4;
}

.path-badge {
  font-size: 0.72rem;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

.badge-beginner { background: rgba(34, 197, 94, 0.15); color: var(--success); }
.badge-intermediate { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
.badge-advanced { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

.path-card-desc {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 16px;
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.path-card-meta {
  display: flex;
  gap: 16px;
  font-size: 0.8rem;
  color: var(--text-muted);
  flex-wrap: wrap;
}

.path-card-meta span { display: flex; align-items: center; gap: 4px; }

.beginner-cta {
  background: linear-gradient(135deg, var(--bg-elevated), var(--bg-card));
  border: 1px solid var(--purple);
  border-radius: var(--radius-lg);
  padding: 24px 32px;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.beginner-cta p { font-size: 1rem; color: var(--text); }
.beginner-cta .btn { flex-shrink: 0; }

.path-hero {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  margin-bottom: 32px;
}

.back-link {
  display: inline-block;
  color: var(--purple-light);
  text-decoration: none;
  font-size: 0.9rem;
  margin-bottom: 20px;
  transition: var(--transition);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}

.back-link:hover { color: #fff; }

.path-hero h1 {
  font-size: clamp(1.5rem, 3vw, 2rem);
  color: #fff;
  margin-bottom: 12px;
}

.path-desc-full {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.9;
  margin-bottom: 20px;
}

.path-skills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.skill-tag {
  background: var(--purple-glow);
  color: var(--purple-light);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  border: 1px solid var(--border);
}

.progress-section { margin-bottom: 32px; }

.progress-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 0.9rem;
  color: var(--text-muted);
}

.progress-bar {
  height: 8px;
  background: var(--bg-elevated);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple), var(--purple-light));
  border-radius: 4px;
  transition: width 0.5s ease;
  width: 0%;
}

.module-section { margin-bottom: 32px; }

.module-title {
  font-size: 1.2rem;
  color: var(--purple-light);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.lesson-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lesson-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: var(--transition);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}

.lesson-item:hover {
  border-color: var(--purple);
  background: var(--bg-elevated);
}

.lesson-item.completed {
  border-color: rgba(34, 197, 94, 0.3);
  background: rgba(34, 197, 94, 0.03);
}

.lesson-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.75rem;
  color: transparent;
  transition: var(--transition);
}

.lesson-item.completed .lesson-check {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.lesson-info { flex: 1; min-width: 0; }

.lesson-name {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.lesson-type {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.lesson-arrow {
  color: var(--text-muted);
  font-size: 1.2rem;
  flex-shrink: 0;
}

.footer {
  text-align: center;
  padding: 32px 24px;
  color: var(--text-muted);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: 60px;
  position: relative;
  z-index: 1;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state h3 {
  color: var(--text);
  margin-bottom: 8px;
  font-size: 1.2rem;
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
    padding: 40px 24px;
    gap: 40px;
    min-height: auto;
  }
  .hero-image { order: -1; }
  .penguin-img { max-width: 320px; padding: 12px; }
  .nav-links {
    display: none;
    position: absolute;
    top: 64px;
    left: 0;
    right: 0;
    background: var(--bg-elevated);
    flex-direction: column;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    gap: 4px;
  }
  .nav-links.open { display: flex; }
  .nav-hamburger { display: flex; }
  .paths-grid { grid-template-columns: 1fr; }
  .path-hero { padding: 24px; }
  .beginner-cta { flex-direction: column; text-align: center; }
  .beginner-cta .btn { width: 100%; }
}

@media (max-width: 480px) {
  .hero-actions { flex-direction: column; }
  .btn { width: 100%; }
  .filters-bar { flex-direction: column; }
  .search-input, .filter-select { width: 100%; }
  .nav-container { padding: 0 16px; }
  .page-container { padding: 32px 16px; }
}
</style>
</head>

/* ---------- اللغة ---------- */
const LANG_KEY = 'midnight-lang';

function getLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'ar' || saved === 'en') return saved;
  } catch (e) {}
  return 'ar';
}

function setLang(lang) {
  if (lang !== 'ar' && lang !== 'en') return;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  applyLang();
}

function t(key) {
  const lang = getLang();
  return (I18N[lang] && I18N[lang][key]) || I18N.ar[key] || key;
}

function applyLang() {
  const lang = getLang();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.placeholder = val;
    } else {
      el.textContent = val;
    }
  });

  const toggle = document.getElementById('langToggle');
  if (toggle) toggle.textContent = lang === 'ar' ? 'EN' : 'ع';

  document.dispatchEvent(new CustomEvent('langChanged', { detail: { lang: lang } }));
}

/* ---------- التخزين المحلي (تقدم المستخدم) ---------- */
const STORAGE_KEY = 'midnight-progress-v1';

function getProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { lessons: {}, labs: {}, xp: 0, pathsStarted: [] };
    const data = JSON.parse(raw);
    return {
      lessons: data.lessons || {},
      labs: data.labs || {},
      xp: data.xp || 0,
      pathsStarted: data.pathsStarted || []
    };
  } catch (e) {
    return { lessons: {}, labs: {}, xp: 0, pathsStarted: [] };
  }
}

function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {}
}

function isLessonDone(pathId, lessonId) {
  const p = getProgress();
  return !!(p.lessons[pathId] && p.lessons[pathId][lessonId]);
}

function markLessonDone(pathId, lessonId) {
  const p = getProgress();
  if (!p.lessons[pathId]) p.lessons[pathId] = {};
  if (p.lessons[pathId][lessonId]) return;
  p.lessons[pathId][lessonId] = true;
  p.xp += 10;
  if (p.pathsStarted.indexOf(pathId) === -1) p.pathsStarted.push(pathId);
  saveProgress(p);
}

function markPathStarted(pathId) {
  const p = getProgress();
  if (p.pathsStarted.indexOf(pathId) === -1) {
    p.pathsStarted.push(pathId);
    saveProgress(p);
  }
}

function countDoneLessons(pathId, allLessons) {
  let done = 0;
  allLessons.forEach(function(l) { if (isLessonDone(pathId, l.id)) done++; });
  return done;
}

/* ---------- مساعدات ---------- */
function pick(obj) {
  if (!obj) return '';
  const lang = getLang();
  return obj[lang] || obj.ar || '';
}

function totalLessons(path) {
  let n = 0;
  path.modules.forEach(function(m) { n += m.lessons.length; });
  return n;
}

function allLessonsFlat(path) {
  let arr = [];
  path.modules.forEach(function(m) { m.lessons.forEach(function(l) { arr.push(l); }); });
  return arr;
}

function levelBadgeClass(level) {
  if (level === 'beginner') return 'badge-beginner';
  if (level === 'intermediate') return 'badge-intermediate';
  return 'badge-advanced';
}

function levelLabel(level) {
  if (level === 'beginner') return t('paths.beginner');
  if (level === 'intermediate') return t('paths.intermediate');
  return t('paths.advanced');
}

function renderPathCards() {
  const grid = document.getElementById('pathsGrid');
  if (!grid) return;

  const searchEl = document.getElementById('pathSearch');
  const levelEl = document.getElementById('levelFilter');
  const q = (searchEl ? searchEl.value : '').toLowerCase().trim();
  const lvl = levelEl ? levelEl.value : 'all';

  const filtered = PATHS_DATA.filter(function(p) {
    const matchesLevel = lvl === 'all' || p.level === lvl;
    const hay = (pick(p.title) + ' ' + pick(p.desc) + ' ' + p.skills.join(' ')).toLowerCase();
    const matchesSearch = !q || hay.indexOf(q) !== -1;
    return matchesLevel && matchesSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><h3>' + t('paths.empty') + '</h3></div>';
    return;
  }

  let html = '';
  filtered.forEach(function(p) {
    const total = totalLessons(p);
    html +=
      '<div class="path-card" data-path="' + p.id + '">' +
        '<div class="path-card-header">' +
          '<div class="path-card-title">' + pick(p.title) + '</div>' +
          '<span class="path-badge ' + levelBadgeClass(p.level) + '">' + levelLabel(p.level) + '</span>' +
        '</div>' +
        '<p class="path-card-desc">' + pick(p.desc) + '</p>' +
        '<div class="path-card-meta">' +
          '<span>📖 ' + total + ' ' + t('paths.lessons') + '</span>' +
          '<span>🧪 ' + p.skills.length + ' skills</span>' +
        '</div>' +
      '</div>';
  });
  grid.innerHTML = html;

  grid.querySelectorAll('.path-card').forEach(function(card) {
    card.addEventListener('click', function() {
      const id = card.getAttribute('data-path');
      navigate('#/path/' + id);
    });
  });
}

function renderPathDetail(pathId) {

  if (!path) {
    return '<div class="page-container"><div class="empty-state"><h3>' + t('path.notFound') + '</h3></div></div>';
  }

  const lessons = allLessonsFlat(path);
  const done = countDoneLessons(path.id, lessons);
  const total = lessons.length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  let modulesHtml = '';
  path.modules.forEach(function(m) {
    let lessonsHtml = '';
    m.lessons.forEach(function(l) {
      const isDone = isLessonDone(path.id, l.id);
      lessonsHtml +=
        '<div class="lesson-item' + (isDone ? ' completed' : '') + '" data-lesson="' + l.id + '">' +

  let skillsHtml = '';
  path.skills.forEach(function(s) {

  return (
    '<div class="page-container">' +

        '</div>' +
      '</div>' +
      modulesHtml +
    '</div>'
  );
}

/* نهاية الجزء الثاني */
/* ============================================================
   الجزء الثالث — الراوتر، ربط الأحداث، الدرس، والتشغيل
   ============================================================ */

/* ---------- الراوتر ---------- */
let currentRoute = null;

function navigate(hash) {
  if (location.hash !== hash) {
    location.hash = hash;
  } else {
    render();
  }
}

function parseRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  if (parts.length === 0) return { page: 'home' };
  if (parts[0] === 'path' && parts[1]) return { page: 'path', id: parts[1] };
  if (parts[0] === 'lesson' && parts[1] && parts[2]) return { page: 'lesson', pathId: parts[1], lessonId: parts[2] };
  return { page: parts[0] };
}

function setActiveNav(page) {
  document.querySelectorAll('.nav-links a').forEach(function(a) {
    a.classList.remove('active');
    if (a.getAttribute('data-nav') === page) a.classList.add('active');
  });
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  const route = parseRoute();
  currentRoute = route;

  let html = '';
  switch (route.page) {
    case 'home':
      html = renderHome();
      setActiveNav('home');
      break;
    case 'paths':
      html = renderPathsPage();
      setActiveNav('paths');
      break;
    case 'path':
      html = renderPathDetail(route.id);
      setActiveNav('paths');
      break;
    case 'lesson':
      html = renderLessonPage(route.pathId, route.lessonId);
      setActiveNav('paths');
      break;
    case 'assessment':
      html = renderAssessmentIntro();
      setActiveNav('assessment');
      break;
    case 'labs':
      html = renderPlaceholder('labs');
      setActiveNav('labs');
      break;
    case 'library':
      html = renderPlaceholder('library');
      setActiveNav('library');
      break;
    case 'cases':
      html = renderPlaceholder('cases');
      setActiveNav('cases');
      break;
    case 'dashboard':
      html = renderDashboard();
      setActiveNav('dashboard');
      break;
    default:
      html = renderHome();
      setActiveNav('home');
  }

  app.innerHTML = html;
  attachPageEvents(route);
  window.scrollTo(0, 0);
}

/* ---------- ربط الأحداث بعد كل render ---------- */
function attachPageEvents(route) {
  // روابط التنقل الداخلية
  document.querySelectorAll('[data-nav]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      const target = el.getAttribute('data-nav');
      if (target === 'home') navigate('#/');
      else navigate('#/' + target);
      closeMobileNav();
    });
  });

  if (route.page === 'paths') {
    const s = document.getElementById('pathSearch');
    const l = document.getElementById('levelFilter');
    if (s) s.addEventListener('input', renderPathCards);
    if (l) l.addEventListener('change', renderPathCards);
    renderPathCards();
    const bb = document.getElementById('beginnerBtn');
    if (bb) bb.addEventListener('click', function() {
      const beginnerPaths = PATHS_DATA.filter(function(p) { return p.level === 'beginner'; });
      if (beginnerPaths.length) navigate('#/path/' + beginnerPaths[0].id);
    });
  }

  if (route.page === 'path') {
    document.querySelectorAll('.lesson-item').forEach(function(item) {
      item.addEventListener('click', function() {
        const lid = item.getAttribute('data-lesson');
        navigate('#/lesson/' + route.id + '/' + lid);
      });
    });
  }

  if (route.page === 'lesson') {
    attachLessonEvents(route.pathId, route.lessonId);
  }

  if (route.page === 'assessment') {
    const btn = document.getElementById('startAssessmentBtn');
    if (btn) btn.addEventListener('click', startAssessment);
  }
}

/* ---------- درس فردي ---------- */
function findLesson(pathId, lessonId) {
  const path = PATHS_DATA.find(function(p) { return p.id === pathId; });
  if (!path) return null;
  for (let i = 0; i < path.modules.length; i++) {
    const m = path.modules[i];
    const l = m.lessons.find(function(x) { return x.id === lessonId; });
    if (l) return { path: path, module: m, lesson: l };
  }
  return null;
}

function getLessonContent(pathId, lessonId) {
  const found = findLesson(pathId, lessonId);
  if (!found) return null;
  const lang = getLang();
  const key = pathId + ':' + lessonId;
  if (LESSON_CONTENT[key] && LESSON_CONTENT[key][lang]) return LESSON_CONTENT[key][lang];
  return {
    intro: lang === 'ar'
      ? 'هذا الدرس جزء من مسار «' + pick(found.path.title) + '». المحتوى التفصيلي لهذا الدرس قيد الإعداد وسيُضاف في تحديث قادم.'
      : 'This lesson is part of "' + pick(found.path.title) + '". Detailed content for this lesson is being prepared and will be added in a future update.',
    body: ''
  };
}

function renderLessonPage(pathId, lessonId) {
  const found = findLesson(pathId, lessonId);
  if (!found) {
    return '<div class="page-container"><div class="empty-state"><h3>' + t('path.notFound') + '</h3></div></div>';
  }
  const content = getLessonContent(pathId, lessonId);
  const isDone = isLessonDone(pathId, lessonId);

  // الدرس السابق والتالي
  const flat = allLessonsFlat(found.path);
  const idx = flat.findIndex(function(l) { return l.id === lessonId; });
  const prev = idx > 0 ? flat[idx - 1] : null;
  const next = idx < flat.length - 1 ? flat[idx + 1] : null;

  let navHtml = '<div class="lesson-nav">';
  if (prev) navHtml += '<button class="btn btn-outline" data-lesson-nav="' + prev.id + '">← ' + pick(prev.title) + '</button>';
  if (next) navHtml += '<button class="btn btn-outline" data-lesson-nav="' + next.id + '">' + pick(next.title) + ' →</button>';
  navHtml += '</div>';

  return (
    '<div class="page-container">' +
      '<button class="back-link" data-nav="path-' + pathId + '">← ' + pick(found.path.title) + '</button>' +
      '<div class="lesson-page">' +
        '<p class="lesson-breadcrumb">' + pick(found.module.title) + '</p>' +
        '<h1 class="lesson-title">' + pick(found.lesson.title) + '</h1>' +
        '<div class="lesson-body">' + content.intro + content.body + '</div>' +
        '<div class="lesson-actions">' +
          (isDone
            ? '<span class="lesson-done-badge">✓ ' + t('path.completed') + '</span>'
            : '<button class="btn btn-primary" id="markDoneBtn">✓ ' + (getLang() === 'ar' ? 'علّم كمكتمل' : 'Mark as Complete') + '</button>'
          ) +
        '</div>' +
        navHtml +
      '</div>' +
    '</div>'
  );
}

function attachLessonEvents(pathId, lessonId) {
  const markBtn = document.getElementById('markDoneBtn');
  if (markBtn) {
    markBtn.addEventListener('click', function() {
      markLessonDone(pathId, lessonId);
      render();
    });
  }
  document.querySelectorAll('[data-lesson-nav]').forEach(function(b) {
    b.addEventListener('click', function() {
      navigate('#/lesson/' + pathId + '/' + b.getAttribute('data-lesson-nav'));
    });
  });
  // ربط زر العودة إلى المسار
  document.querySelectorAll('[data-nav]').forEach(function(el) {
    const target = el.getAttribute('data-nav');
    if (target && target.indexOf('path-') === 0) {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        navigate('#/path/' + target.replace('path-', ''));
      });
    }
  });
}

function startAssessment() {
  assessmentState = {
    index: 0,
    answers: new Array(ASSESSMENT_QUESTIONS.length).fill(null)
  };
  renderAssessmentQuestion();
}

/* ---------- عرض سؤال ---------- */
function renderAssessmentQuestion() {
  const app = document.getElementById('app');
  if (!app || !assessmentState) return;
  const lang = getLang();
  const idx = assessmentState.index;
  const q = ASSESSMENT_QUESTIONS[idx];
  const selected = assessmentState.answers[idx];

  let optionsHtml = '';
  q.options.forEach(function(opt, i) {
    const isSel = selected === i;
    optionsHtml +=
      '<label class="option-item' + (isSel ? ' selected' : '') + '" data-opt="' + i + '">' +
        '<input type="radio" name="qopt" value="' + i + '"' + (isSel ? ' checked' : '') + '>' +
        '<span class="option-text">' + pick(opt) + '</span>' +
      '</label>';
  });

  // خيار "ما أعرف"
  const dontKnow = assessmentState.answers[idx] === -1;
  optionsHtml +=
    '<label class="option-item option-dontknow' + (dontKnow ? ' selected' : '') + '" data-opt="-1">' +
      '<input type="radio" name="qopt" value="-1"' + (dontKnow ? ' checked' : '') + '>' +
      '<span class="option-text">' + t('assessment.dontKnow') + '</span>' +
    '</label>';

  const isLast = idx === ASSESSMENT_QUESTIONS.length - 1;

  app.innerHTML =
    '<div class="page-container">' +
      '<div class="assessment-progress">' +
        '<div class="assessment-progress-bar">' +
          '<div class="assessment-progress-fill" style="width:' + ((idx + 1) / ASSESSMENT_QUESTIONS.length * 100) + '%"></div>' +
        '</div>' +
        '<p class="assessment-progress-label">' + t('assessment.question') + ' ' + (idx + 1) + ' ' + t('assessment.of') + ' ' + ASSESSMENT_QUESTIONS.length + '</p>' +
      '</div>' +
      '<div class="assessment-card">' +
        '<h2 class="assessment-question">' + pick(q.q) + '</h2>' +
        '<div class="options-list" id="optionsList">' + optionsHtml + '</div>' +
        '<p class="assessment-error" id="assessmentError" style="display:none">' + t('assessment.mustAnswer') + '</p>' +
        '<div class="assessment-actions">' +
          '<button class="btn btn-outline" id="prevQBtn"' + (idx === 0 ? ' disabled' : '') + '>' + t('assessment.prev') + '</button>' +
          '<button class="btn btn-primary" id="nextQBtn">' +
            (isLast ? t('assessment.finish') : t('assessment.next')) +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  // ربط أحداث الخيارات
  document.querySelectorAll('.option-item').forEach(function(label) {
    label.addEventListener('click', function() {
      const val = parseInt(label.getAttribute('data-opt'), 10);
      assessmentState.answers[idx] = val;
      document.querySelectorAll('.option-item').forEach(function(l) { l.classList.remove('selected'); });
      label.classList.add('selected');
      const err = document.getElementById('assessmentError');
      if (err) err.style.display = 'none';
    });
  });

  const prevBtn = document.getElementById('prevQBtn');
  if (prevBtn) prevBtn.addEventListener('click', function() {
    if (assessmentState.index > 0) {
      assessmentState.index--;
      renderAssessmentQuestion();
    }
  });

  const nextBtn = document.getElementById('nextQBtn');
  if (nextBtn) nextBtn.addEventListener('click', function() {
    if (assessmentState.answers[idx] === null) {
      const err = document.getElementById('assessmentError');
      if (err) err.style.display = 'block';
      return;
    }
    if (isLast) {
      renderAssessmentResults();
    } else {
      assessmentState.index++;
      renderAssessmentQuestion();
    }
  });
}

/* ---------- النتائج ---------- */
function renderAssessmentResults() {
  const app = document.getElementById('app');
  if (!app || !assessmentState) return;
  const lang = getLang();

  // حساب النتائج حسب المجال
  const catStats = {};
  ASSESSMENT_QUESTIONS.forEach(function(q, i) {
    if (!catStats[q.category]) catStats[q.category] = { total: 0, correct: 0, level: q.level };
    catStats[q.category].total++;
    if (assessmentState.answers[i] === q.correct) catStats[q.category].correct++;
  });

  // حساب المستوى العام
  let totalCorrect = 0;
  let totalAnswered = 0;
  ASSESSMENT_QUESTIONS.forEach(function(q, i) {
    if (assessmentState.answers[i] !== null && assessmentState.answers[i] !== -1) {
      totalAnswered++;
      if (assessmentState.answers[i] === q.correct) totalCorrect++;
    }
  });

  const accuracy = totalAnswered > 0 ? totalCorrect / totalAnswered : 0;
  let levelKey = 'assessment.levelBeginner';
  if (accuracy >= 0.75) levelKey = 'assessment.levelAdvanced';
  else if (accuracy >= 0.45) levelKey = 'assessment.levelIntermediate';

  // المجالات القوية والضعيفة
  const strong = [];
  const weak = [];
  const catNames = {
    networking: { ar: 'الشبكات', en: 'Networking' },
    linux: { ar: 'لينكس', en: 'Linux' },
    python: { ar: 'بايثون', en: 'Python' },
    web: { ar: 'أمن المواقع', en: 'Web Security' },
    defense: { ar: 'الدفاع السيبراني', en: 'Cyber Defense' },
    forensics: { ar: 'التحقيق الجنائي', en: 'Forensics' }
  };
  Object.keys(catStats).forEach(function(cat) {
    const s = catStats[cat];
    const ratio = s.total > 0 ? s.correct / s.total : 0;
    const name = catNames[cat] ? pick(catNames[cat]) : cat;
    if (ratio >= 0.6) strong.push(name);
    else if (ratio < 0.4) weak.push(name);
  });

  // التوصيات المرتبطة بالمجالات الضعيفة
  const recommendations = [];
  const pathMap = {
    networking: 'networking',
    linux: 'linux',
    python: 'python',
    web: 'websec'
  };

  Object.keys(catStats).forEach(function(cat) {
    const s = catStats[cat];
    const ratio = s.total > 0 ? s.correct / s.total : 0;
    if (ratio < 0.6 && pathMap[cat]) {
      const path = PATHS_DATA.find(function(p) { return p.id === pathMap[cat]; });
      if (path) {
        recommendations.push({
          path: path,
          reason: lang === 'ar'
            ? 'نتيجتك في ' + pick(catNames[cat] || {ar:cat,en:cat}) + ' كانت ' + s.correct + '/' + s.total + '، وهذا المسار يبني الأساس المناسب.'
            : 'Your score in ' + pick(catNames[cat] || {ar:cat,en:cat}) + ' was ' + s.correct + '/' + s.total + '. This path builds a solid foundation.'
        });
      }
    }
  });

  if (recommendations.length === 0) {
    recommendations.push({
      path: PATHS_DATA[0],
      reason: lang === 'ar' ? 'أداء جيد في الاختبار، ابدأ بمسار الشبكات لتثبيت الأساسيات.' : 'Good performance. Start with Networking to solidify fundamentals.'
    });
  }

  // بناء HTML
  let strongHtml = strong.length ? strong.map(function(s) { return '<span class="tag tag-good">' + s + '</span>'; }).join('') : '<span class="tag">—</span>';
  let weakHtml = weak.length ? weak.map(function(s) { return '<span class="tag tag-bad">' + s + '</span>'; }).join('') : '<span class="tag">—</span>';

  let recsHtml = '';
  recommendations.forEach(function(r) {
    recsHtml +=
      '<div class="rec-card">' +
        '<h3>' + pick(r.path.title) + '</h3>' +
        '<p>' + r.reason + '</p>' +
        '<button class="btn btn-primary" data-rec-path="' + r.path.id + '">' + t('assessment.startPath') + '</button>' +
      '</div>';
  });

  app.innerHTML =
    '<div class="page-container">' +
      '<div class="page-header">' +
        '<h1 class="page-title">' + t('assessment.resultsTitle') + '</h1>' +
      '</div>' +
      '<div class="results-box">' +
        '<div class="result-stat">' +
          '<span class="result-label">' + t('assessment.level') + '</span>' +
          '<span class="result-value">' + t(levelKey) + '</span>' +
        '</div>' +
        '<div class="result-stat">' +

  document.querySelectorAll('[data-rec-path]').forEach(function(b) {
    b.addEventListener('click', function() {
      navigate('#/path/' + b.getAttribute('data-rec-path'));

  if (retake) retake.addEventListener('click', function() {

  window.scrollTo(0, 0);
}

        '<div class="path-card-header">' +

function attachLabsEvents() {
  const s = document.getElementById('labSearch');
  const l = document.getElementById('labLevelFilter');
  const grid = document.getElementById('labsGrid');
  if (!grid) return;
  const lang = getLang();

  function filterLabs() {
    const q = (s.value || '').toLowerCase().trim();
    const lvl = l.value || 'all';
    const filtered = LABS_DATA.filter(function(lab) {
      const hay = (pick(lab.title) + ' ' + pick(lab.desc)).toLowerCase();
      return (lvl === 'all' || lab.level === lvl) && (!q || hay.indexOf(q) !== -1);
    });
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><h3>' + (lang === 'ar' ? 'لا نتائج' : 'No results') + '</h3></div>';
      return;
    }
    let html = '';
    filtered.forEach(function(lab) {
      html +=
        '<div class="path-card" data-lab="' + lab.id + '">' +
          '<div class="path-card-header">' +
            '<div class="path-card-title">' + pick(lab.title) + '</div>' +
            '<span class="path-badge ' + levelBadgeClass(lab.level) + '">' + levelLabel(lab.level) + '</span>' +
          '</div>' +
          '<p class="path-card-desc">' + pick(lab.desc) + '</p>' +
          '<div class="path-card-meta"><span>🧪 ' + (lang === 'ar' ? 'مختبر عملي' : 'Hands-on lab') + '</span></div>' +
        '</div>';
    });
    grid.innerHTML = html;
  }

  s.addEventListener('input', filterLabs);
  l.addEventListener('change', filterLabs);
}

/* ---------- تحديث الراوتر ليشمل الأقسام الحقيقية ---------- */
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  const route = parseRoute();
  currentRoute = route;

  let html = '';
  switch (route.page) {
    case 'home':
      html = renderHome();
      setActiveNav('home');
      break;
    case 'paths':
      html = renderPathsPage();
      setActiveNav('paths');
      break;
    case 'path':
      html = renderPathDetail(route.id);
      setActiveNav('paths');
      break;
    case 'lesson':
      html = renderLessonPage(route.pathId, route.lessonId);
      setActiveNav('paths');
      break;
    case 'assessment':
      if (assessmentState) {
        if (assessmentState.done) {
          renderAssessmentResults();
          return;
        }
        html = '';
      } else {
        html = renderAssessmentIntro();
      }
      setActiveNav('assessment');
      break;
    case 'labs':
      html = renderLabsPage();
      setActiveNav('labs');
      break;
    case 'library':
      html = renderLibraryPage();
      setActiveNav('library');
      break;
    case 'cases':
      html = renderCasesPage();
      setActiveNav('cases');
      break;
    case 'dashboard':
      html = renderDashboard();
      setActiveNav('dashboard');
      break;
    default:
      html = renderHome();
      setActiveNav('home');
  }

  if (html !== '') {
    app.innerHTML = html;
  }
  attachPageEvents(route);
  window.scrollTo(0, 0);
}

/* ---------- إعادة تعريف ربط الأحداث ليشمل المختبرات ---------- */
function attachPageEvents(route) {
  document.querySelectorAll('[data-nav]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      const target = el.getAttribute('data-nav');
      if (target === 'home') navigate('#/');
      else navigate('#/' + target);
      closeMobileNav();
    });
  });

  if (route.page === 'paths') {
    const s = document.getElementById('pathSearch');
    const l = document.getElementById('levelFilter');
    if (s) s.addEventListener('input', renderPathCards);
    if (l) l.addEventListener('change', renderPathCards);
    renderPathCards();
    const bb = document.getElementById('beginnerBtn');
    if (bb) bb.addEventListener('click', function() {
      const beginnerPaths = PATHS_DATA.filter(function(p) { return p.level === 'beginner'; });
      if (beginnerPaths.length) navigate('#/path/' + beginnerPaths[0].id);
    });
  }

  if (route.page === 'path') {
    document.querySelectorAll('.lesson-item').forEach(function(item) {
      item.addEventListener('click', function() {
        const lid = item.getAttribute('data-lesson');
        navigate('#/lesson/' + route.id + '/' + lid);
      });
    });
    document.querySelectorAll('[data-nav]').forEach(function(el) {
      if (el.classList.contains('back-link')) {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          navigate('#/paths');
        });
      }
    });
  }

  if (route.page === 'lesson') {
    attachLessonEvents(route.pathId, route.lessonId);
  }

  if (route.page === 'assessment') {
    const btn = document.getElementById('startAssessmentBtn');
    if (btn) btn.addEventListener('click', function() {
      assessmentState = { index: 0, answers: new Array(ASSESSMENT_QUESTIONS.length).fill(null), done: false };
      renderAssessmentQuestion();
    });
  }

  if (route.page === 'labs') {
    attachLabsEvents();
  }
}

/* ---------- تعديل renderAssessmentQuestion ليضبط done ---------- */
const _origRenderAssessmentQuestion = renderAssessmentQuestion;
renderAssessmentQuestion = function() {
  if (assessmentState) assessmentState.done = false;
  _origRenderAssessmentQuestion();
};

const _origRenderAssessmentResults = renderAssessmentResults;
renderAssessmentResults = function() {
  if (assessmentState) assessmentState.done = true;
  _origRenderAssessmentResults();
};

/* ---------- إعادة تشغيل التهيئة بأمان ---------- */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

/* نهاية الجزء السادس */
/* ============================================================
   الجزء السابع (الأخير) — تنظيف + إغلاق الملف
   ============================================================ */

(function finalInit() {
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    if (document.getElementById('app')) {
      if (!window.__midnightInited) {
        window.__midnightInited = true;
        init();
      }
    }
  }
})();
